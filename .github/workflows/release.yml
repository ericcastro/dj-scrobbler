name: Release

# Triggers on version tags: git tag v0.4.0 && git push --tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  sca:
    uses: ./.github/workflows/sca.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  # ── Delete any existing draft release so re-runs don't hit 422 on .blockmap ──
  delete-draft:
    needs: sca
    runs-on: ubuntu-latest
    steps:
      - name: Delete existing draft release for this tag (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases \
            --jq ".[] | select(.tag_name==\"$TAG\" and .draft==true) | .id" | head -1)
          if [ -n "$RELEASE_ID" ]; then
            echo "Deleting draft release $RELEASE_ID for $TAG"
            gh api -X DELETE repos/${{ github.repository }}/releases/$RELEASE_ID
          else
            echo "No existing draft release found for $TAG"
          fi

  # ── macOS ─────────────────────────────────────────────────────────────────────
  build-mac:
    needs: delete-draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check release metadata and tag
        run: npm run check:release

      - name: Restore media tool builds
        # Reuse only builds keyed by the pinned source manifest and recipes.
        # Native runtime/license/material checks still run below.
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/dj-scrobbler-media-tools
          key: media-macos-latest-${{ runner.arch }}-${{ hashFiles('scripts/build-*.sh', 'scripts/media-tool-assets.js') }}

      - name: Check media decoder runtime
        run: npm run test:media

      - name: Build & publish (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable certificate auto-discovery — afterPack.js handles ad-hoc
          # signing instead, which fixes the "different Team IDs" crash on macOS 15.
          # When real code-signing + notarization is set up, uncomment these and
          # remove the afterPack hook (or gate it on CSC_LINK being unset).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:mac -- --publish always

  # ── Windows ───────────────────────────────────────────────────────────────────
  build-win:
    needs: delete-draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check release metadata and tag
        run: npm run check:release

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc make diffutils tar xz

      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/dj-scrobbler-media-tools
          key: media-windows-latest-${{ runner.arch }}-${{ hashFiles('scripts/build-*.sh', 'scripts/media-tool-assets.js') }}

      - name: Build & publish (Windows)
        shell: msys2 {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DJ_SCROBBLER_BUILD_BASH="$(cygpath -w /usr/bin/bash)"
          export DJ_SCROBBLER_TOOLCHAIN_LICENSES="$(cygpath -w "$MINGW_PREFIX/share/licenses")"
          npm run test:media
          npm run build:win -- --publish always

  # ── Linux ─────────────────────────────────────────────────────────────────────
  build-linux:
    needs: delete-draft
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check release metadata and tag
        run: npm run check:release

      - name: Restore media tool builds
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/dj-scrobbler-media-tools
          key: media-ubuntu-22.04-${{ runner.arch }}-${{ hashFiles('scripts/build-*.sh', 'scripts/media-tool-assets.js') }}

      - name: Check media decoder runtime
        run: npm run test:media

      - name: Build & publish (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:linux -- --publish always
